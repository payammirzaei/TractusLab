<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">TractusLab learning journey</title><desc id="desc">Animated Discover, Learn, Practice, Validate and Complete learning flow.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#0b1c18"/></linearGradient>
<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#ecfdf5}.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#8fb7aa}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6f9588}.box{fill:#0d1916;stroke:#21483e;stroke-width:1.2}.path{stroke:url(#flow);stroke-width:3;fill:none;stroke-dasharray:10 12;animation:dash 2s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.float{animation:float 3s ease-in-out infinite}.delay1{animation-delay:.25s}.delay2{animation-delay:.5s}.delay3{animation-delay:.75s}.delay4{animation-delay:1s}@keyframes dash{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.35}}@keyframes float{50%{transform:translateY(-5px)}}</style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<g opacity=".2" stroke="#15372f"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/><path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420"/></g>
<text x="58" y="58" class="t" font-size="27" font-weight="800">TractusLab — learning journey</text>
<text x="58" y="84" class="s" font-size="13">From first contact with the business problem to validated understanding and mastery.</text>
<path class="path" d="M138 238H1062"/>
<g transform="translate(58 155)" class="float"><rect class="box" width="180" height="150" rx="20"/><text x="20" y="34" class="m" font-size="10">01</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Discover</text><text x="20" y="88" class="s" font-size="12">Start with the</text><text x="20" y="106" class="s" font-size="12">business problem</text><circle cx="90" cy="150" r="5" fill="#34d399" filter="url(#glow)" class="pulse"/></g>
<g transform="translate(286 155)" class="float delay1"><rect class="box" width="180" height="150" rx="20"/><text x="20" y="34" class="m" font-size="10">02</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Learn</text><text x="20" y="88" class="s" font-size="12">Follow the visual</text><text x="20" y="106" class="s" font-size="12">dataspace exchange</text><circle cx="90" cy="150" r="5" fill="#34d399" filter="url(#glow)" class="pulse"/></g>
<g transform="translate(514 155)" class="float delay2"><rect class="box" width="180" height="150" rx="20"/><text x="20" y="34" class="m" font-size="10">03</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Practice</text><text x="20" y="88" class="s" font-size="12">Switch depth and</text><text x="20" y="106" class="s" font-size="12">interact with the flow</text><circle cx="90" cy="150" r="5" fill="#38bdf8" filter="url(#glow)" class="pulse"/></g>
<g transform="translate(742 155)" class="float delay3"><rect class="box" width="180" height="150" rx="20"/><text x="20" y="34" class="m" font-size="10">04</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Validate</text><text x="20" y="88" class="s" font-size="12">Diagnose failures</text><text x="20" y="106" class="s" font-size="12">inside Boss Fights</text><circle cx="90" cy="150" r="5" fill="#f59e0b" filter="url(#glow)" class="pulse"/></g>
<g transform="translate(970 155)" class="float delay4"><rect class="box" width="172" height="150" rx="20"/><text x="20" y="34" class="m" font-size="10">05</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Complete</text><text x="20" y="88" class="s" font-size="12">Earn progress, score</text><text x="20" y="106" class="s" font-size="12">and mastery evidence</text><circle cx="86" cy="150" r="5" fill="#38bdf8" filter="url(#glow)" class="pulse"/></g>
<text x="58" y="365" class="m" font-size="10">DISCOVER → LEARN → PRACTICE → VALIDATE → COMPLETE</text>
</svg>