<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">TractusLab simulation flow</title><desc id="desc">Animated flow from business problem through role depths to Boss Fight and mastery.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08110f"/><stop offset="1" stop-color="#0b1720"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#ecfdf5}.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#91a9a2}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6e8982}.box{fill:#0d1917;stroke:#23483f;stroke-width:1.2}.flow{stroke:url(#g);stroke-width:3;fill:none;stroke-dasharray:9 12;animation:dash 2s linear infinite}.packet{animation:p 1.4s ease-in-out infinite}.role{animation:role 4.5s ease-in-out infinite}.r2{animation-delay:1.5s}.r3{animation-delay:3s}@keyframes dash{to{stroke-dashoffset:-42}}@keyframes p{50%{opacity:.25}}@keyframes role{0%,28%,100%{opacity:.45}10%,18%{opacity:1}}</style></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/><g opacity=".18" stroke="#17352f"><path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200"/><path d="M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/></g>
<text x="56" y="58" class="t" font-size="27" font-weight="800">Simulation-first learning loop</text><text x="56" y="84" class="s" font-size="13">One business story, three depths, then a diagnostic challenge that proves understanding.</text>
<g transform="translate(56 150)"><rect class="box" width="190" height="110" rx="18"/><text x="18" y="32" class="m" font-size="10">BUSINESS FIRST</text><text x="18" y="61" class="t" font-size="18" font-weight="800">Business problem</text><text x="18" y="85" class="s" font-size="11">Why does data need to move?</text></g>
<path class="flow" d="M246 205H328"/><circle cx="286" cy="205" r="4" fill="#34d399" class="packet" filter="url(#glow)"/>
<g transform="translate(328 135)"><rect class="box" width="250" height="140" rx="20"/><text x="20" y="32" class="m" font-size="10">VISUAL EXCHANGE</text><text x="20" y="62" class="t" font-size="18" font-weight="800">Dataspace cockpit</text><text x="20" y="88" class="s" font-size="11">participants · events · policy</text><text x="20" y="106" class="s" font-size="11">contract · trusted exchange</text></g>
<path class="flow" d="M578 205H650"/><circle cx="614" cy="205" r="4" fill="#38bdf8" class="packet" filter="url(#glow)"/>
<g transform="translate(650 118)"><rect class="box" width="230" height="174" rx="20"/><text x="20" y="32" class="m" font-size="10">PROGRESSIVE DEPTH</text><g class="role"><rect x="18" y="48" width="194" height="30" rx="9" fill="#10221d" stroke="#2f6c5d"/><text x="32" y="68" class="t" font-size="12" font-weight="700">Manager · why it matters</text></g><g class="role r2"><rect x="18" y="86" width="194" height="30" rx="9" fill="#111e26" stroke="#315e78"/><text x="32" y="106" class="t" font-size="12" font-weight="700">Architect · how it fits</text></g><g class="role r3"><rect x="18" y="124" width="194" height="30" rx="9" fill="#111a26" stroke="#335b88"/><text x="32" y="144" class="t" font-size="12" font-weight="700">Developer · what happens</text></g></g>
<path class="flow" d="M880 205H954"/><circle cx="917" cy="205" r="4" fill="#f59e0b" class="packet" filter="url(#glow)"/>
<g transform="translate(954 135)"><rect class="box" width="190" height="140" rx="20" stroke="#805e22"/><text x="18" y="32" class="m" font-size="10">DIAGNOSE</text><text x="18" y="62" class="t" font-size="18" font-weight="800">Boss Fight</text><text x="18" y="88" class="s" font-size="11">Break the exchange.</text><text x="18" y="106" class="s" font-size="11">Find the root cause.</text></g>
<path class="flow" d="M1048 275V355H765"/>
<g transform="translate(555 355)"><rect class="box" width="420" height="108" rx="20"/><text x="22" y="33" class="m" font-size="10">LEARNING EVIDENCE</text><text x="22" y="63" class="t" font-size="20" font-weight="800">Score · competency · mastery</text><text x="22" y="87" class="s" font-size="11">Progress is saved locally and can sync to the backend.</text></g>
<path class="flow" d="M555 409H350V315H150V260"/><circle cx="452" cy="409" r="4" fill="#34d399" class="packet" filter="url(#glow)"/>
<text x="56" y="514" class="m" font-size="10">LEARN → BREAK → DIAGNOSE → UNDERSTAND → REPEAT</text>
</svg>