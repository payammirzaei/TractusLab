<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">TractusLab runtime topology</title><desc id="desc">Animated topology showing browser, Next.js, FastAPI, PostgreSQL, packaged content and Railway runtime.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07110f"/><stop offset="1" stop-color="#0b1620"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#ecfdf5}.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#8eaaa1}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6f8f86}.box{fill:#0d1917;stroke:#23483f;stroke-width:1.2}.blue{stroke:#315f88}.amber{stroke:#805f23}.flow{stroke:url(#g);stroke-width:3;fill:none;stroke-dasharray:9 12;animation:dash 2s linear infinite}.packet{animation:p 1.4s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-42}}@keyframes p{50%{opacity:.25}}</style></defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/><g opacity=".18" stroke="#17352f"><path d="M0 75H1200M0 150H1200M0 225H1200M0 300H1200M0 375H1200M0 450H1200M0 525H1200"/><path d="M120 0V600M240 0V600M360 0V600M480 0V600M600 0V600M720 0V600M840 0V600M960 0V600M1080 0V600"/></g>
<text x="58" y="58" class="t" font-size="27" font-weight="800">TractusLab — runtime topology</text><text x="58" y="84" class="s" font-size="13">A resilient learning frontend with real API, durable state, packaged fallback content and Railway deployment.</text>
<g transform="translate(58 180)"><rect class="box" width="180" height="100" rx="18"/><text x="20" y="32" class="m" font-size="10">CLIENT</text><text x="20" y="61" class="t" font-size="18" font-weight="800">Browser</text><text x="20" y="82" class="s" font-size="11">learner · author · admin</text></g>
<path class="flow" d="M238 230H330"/><circle cx="284" cy="230" r="4" fill="#34d399" class="packet" filter="url(#glow)"/>
<g transform="translate(330 145)"><rect class="box blue" width="250" height="170" rx="20"/><text x="20" y="32" class="m" font-size="10">EXPERIENCE</text><text x="20" y="62" class="t" font-size="19" font-weight="800">Next.js + React</text><text x="20" y="89" class="s" font-size="11">simulation UI</text><text x="20" y="108" class="s" font-size="11">local learning cache</text><text x="20" y="127" class="s" font-size="11">runtime content overlay</text><text x="20" y="146" class="s" font-size="11">offline / recovery UX</text></g>
<path class="flow" d="M580 230H684"/><circle cx="632" cy="230" r="4" fill="#38bdf8" class="packet" filter="url(#glow)"/>
<g transform="translate(684 145)"><rect class="box" width="220" height="170" rx="20"/><text x="20" y="32" class="m" font-size="10">CONTROL PLANE</text><text x="20" y="62" class="t" font-size="19" font-weight="800">FastAPI</text><text x="20" y="89" class="s" font-size="11">accounts + sessions</text><text x="20" y="108" class="s" font-size="11">progress + scores</text><text x="20" y="127" class="s" font-size="11">content workflow</text><text x="20" y="146" class="s" font-size="11">RBAC + audit</text></g>
<path class="flow" d="M904 230H1000"/><circle cx="952" cy="230" r="4" fill="#34d399" class="packet" filter="url(#glow)"/>
<g transform="translate(1000 165)"><rect class="box blue" width="144" height="130" rx="20"/><text x="18" y="32" class="m" font-size="10">STATE</text><text x="18" y="62" class="t" font-size="18" font-weight="800">PostgreSQL</text><text x="18" y="88" class="s" font-size="10">users · content</text><text x="18" y="105" class="s" font-size="10">progress · audit</text></g>
<g transform="translate(330 390)"><rect class="box amber" width="250" height="105" rx="18"/><text x="20" y="32" class="m" font-size="10">FALLBACK</text><text x="20" y="61" class="t" font-size="17" font-weight="800">Packaged content</text><text x="20" y="82" class="s" font-size="11">renders even when API content is unavailable</text></g>
<path class="flow" d="M455 390V315"/><circle cx="455" cy="352" r="4" fill="#f59e0b" class="packet" filter="url(#glow)"/>
<g transform="translate(684 390)"><rect class="box" width="220" height="105" rx="18"/><text x="20" y="32" class="m" font-size="10">DEPLOYMENT</text><text x="20" y="61" class="t" font-size="17" font-weight="800">Railway</text><text x="20" y="82" class="s" font-size="11">web · api · postgres</text></g>
<path class="flow" d="M794 390V315"/>
<text x="58" y="548" class="m" font-size="10">RESILIENCE RULE: packaged learning stays usable · server content overlays only when valid · mutations are never auto-replayed</text>
</svg>