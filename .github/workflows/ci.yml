name: TractusLab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Verify Alembic migration
        working-directory: apps/api
        run: |
          rm -f ci_migration.db
          DATABASE_URL=sqlite+pysqlite:///./ci_migration.db alembic upgrade head
          rm -f ci_migration.db

      - name: Run API tests
        run: pytest -q apps/api/tests
        env:
          PYTHONPATH: apps/api

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run simulator tests
        run: npm test

      - name: Type-check application
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
